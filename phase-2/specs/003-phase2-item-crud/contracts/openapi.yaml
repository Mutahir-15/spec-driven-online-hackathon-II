openapi: 3.0.0
info:
  title: Todo App API
  version: 1.0.0
  description: API for managing Todo Items.
paths:
  /items/:
    get:
      summary: List Items
      operationId: read_items
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemRead'
    post:
      summary: Create Item
      operationId: create_item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemRead'

  /items/{item_id}:
    get:
      summary: Read Item
      operationId: read_item
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemRead'
        '404':
          description: Item not found

    patch:
      summary: Update Item
      operationId: update_item
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemRead'
        '404':
          description: Item not found

    delete:
      summary: Delete Item
      operationId: delete_item
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Successful Response
        '404':
          description: Item not found

components:
  schemas:
    ItemCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
          nullable: true

    ItemUpdate:
      type: object
      properties:
        title:
          type: string
          title: Title
          nullable: true
        description:
          type: string
          title: Description
          nullable: true

    ItemRead:
      type: object
      required:
        - id
        - title
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          title: ID
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
          nullable: true
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
